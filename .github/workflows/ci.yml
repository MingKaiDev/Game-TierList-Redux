name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the run that is still going (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deploy halfway; only cancel superseded PR runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy-api:
    name: deploy-api (${{ github.event_name == 'push' && 'production' || 'staging' }})
    needs: check
    # PRs deploy to staging, merges to main deploy to production.
    # Forked PRs get no secrets, so they are skipped.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # One deploy per target at a time; queue instead of cancelling.
      group: deploy-api-${{ github.event_name == 'push' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'staging' }}
      API_URL: ${{ github.event_name == 'push' && 'https://gtl-api.gaymingkai.workers.dev' || 'https://gtl-api-staging.gaymingkai.workers.dev' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env "$TARGET" --var "VERSION:${GITHUB_SHA::7}"

      - name: Smoke test /api/v1/health
        run: |
          expected="\"version\":\"${GITHUB_SHA::7}\""
          for i in $(seq 1 12); do
            body=$(curl -fsS "$API_URL/api/v1/health" || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "$expected"; then
              echo "### API ($TARGET) is live: $API_URL/api/v1/health" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Health check never returned version ${GITHUB_SHA::7}" >&2
          exit 1
